# Manual live smoke tests against the real DeepSeek API.
# Requires a repository Actions secret named DEEPSEEK_API_KEY.
# Manual-only (workflow_dispatch) so it never spends DeepSeek quota on routine pushes.

name: DeepSeek Live Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "DeepSeek model to smoke (provider model id)"
        required: false
        default: "deepseek-v4-pro"

concurrency:
  group: deepseek-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepseek-smoke:
    name: deepseek-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.15"
          enable-cache: true
          cache-python: true

      - name: Run DeepSeek provider smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FCC_LIVE_SMOKE: "1"
          FCC_SMOKE_TARGETS: "providers"
          FCC_SMOKE_PROVIDER_MATRIX: "deepseek"
          FCC_SMOKE_MODEL_DEEPSEEK: ${{ inputs.model }}
        run: uv run pytest smoke/product -n 0 -s --tb=short
